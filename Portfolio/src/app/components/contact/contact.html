<section id="contact" class="section section-alt">
  <div class="section-inner">
    <span class="section-label">Contact</span>
    <h2 class="section-title reveal" appearOnScroll>Let's build something</h2>

    <div class="contact-grid">
      <div class="contact-info reveal" appearOnScroll>
        <p>
          Have an opportunity, project, or idea in mind? Let’s connect and explore how we can build something impactful together.
        </p>
        <a class="email-link gradient-text" href="mailto:guruprasadjadhav911@gmail.com">guruprasadjadhav911@gmail.com</a>

        <div class="social-row">
          <a href="https://github.com/GuruJadhav2007" aria-label="GitHub" target="_blank">GitHub</a>
          <a href="https://www.linkedin.com/in/-profile-guruprasad-jadhav/" aria-label="LinkedIn" target="_blank">LinkedIn</a>
          <!-- <a href="#" aria-label="Twitter">Twitter</a> -->
        </div>
      </div>

      <form class="contact-form reveal" appearOnScroll (ngSubmit)="onSubmit()">
        <label for="name">Name</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" required />

        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" required />

        <label for="message">Message</label>
        <textarea id="message" rows="4" [(ngModel)]="message" name="message" required></textarea>

        <button class="btn btn-primary" type="submit">Send Message</button>

        @if (submitted()) {
          <p class="success-msg">Message sent — thanks for reaching out!</p>
        }
      </form>
    </div>
  </div>
</section>
